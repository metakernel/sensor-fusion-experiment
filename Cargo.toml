[workspace]
resolver = "3"
members = [
    "crates/sfx-core",
    "crates/sfx-config",
    "crates/sfx-data",
    "crates/sfx-waymo",
    "crates/sfx-preprocess",
    "crates/sfx-models",
    "crates/sfx-train",
    "crates/sfx-eval",
    "crates/sfx-tui",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/metakernel/sensor-fusion-experiment"

[workspace.dependencies]
anyhow = "1.0"
burn = { version = "0.21.0", default-features = false, features = ["std", "flex", "autodiff"] }
clap = { version = "4.5", features = ["derive"] }
sfx-data = { path = "crates/sfx-data" }
sfx-config = { path = "crates/sfx-config" }
sfx-core = { path = "crates/sfx-core" }
sfx-models = { path = "crates/sfx-models" }
sfx-preprocess = { path = "crates/sfx-preprocess" }
sfx-train = { path = "crates/sfx-train" }
sfx-waymo = { path = "crates/sfx-waymo" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1.2+spec-1.1.0"
