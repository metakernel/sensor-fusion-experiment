[workspace]
resolver = "3"
members = [
    "crates/sfx-core",
    "crates/sfx-config",
    "crates/sfx-data",
    "crates/sfx-waymo",
    "crates/sfx-preprocess",
    "crates/sfx-models",
    "crates/sfx-train",
    "crates/sfx-eval",
    "crates/sfx-tui",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/metakernel/sensor-fusion-experiment"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
